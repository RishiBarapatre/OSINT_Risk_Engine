version: '3.8'

services:
  backend:
    build: .
    container_name: osint_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: .
    container_name: osint_frontend
    ports:
      - "8501:8501"
    environment:
      # Tell the frontend how to route traffic to the backend container
      - BACKEND_API_URL=http://backend:8000/analyze
    depends_on:
      - backend
    command: streamlit run app/frontend.py --server.port=8501 --server.address=0.0.0.0